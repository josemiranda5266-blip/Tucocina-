<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f59e0b" />
    <meta name="description" content="Descubrí recetas, cocina y pastelería con videos de creadores y plataformas originales." />
    <meta property="og:site_name" content="CociFlash" />
    <meta property="og:title" content="CociFlash | Videos de cocina y recetas" />
    <meta property="og:description" content="Descubrí recetas, cocina y pastelería con videos de creadores y plataformas originales." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CociFlash | Videos de cocina y recetas" />
    <meta name="twitter:description" content="Descubrí recetas, cocina y pastelería con videos de creadores y plataformas originales." />
    <title>CociFlash | Videos de cocina y recetas</title>
  </head>
  <body>
    <div id="root">
      <main id="app-fallback" role="status" aria-live="polite" style="max-width:640px;margin:12vh auto;padding:24px;font-family:system-ui,sans-serif;color:#292524;text-align:center">
        <h1 style="font-size:1.6rem;margin-bottom:12px">CociFlash</h1>
        <p id="app-fallback-message" style="line-height:1.6">Estamos iniciando la aplicación. Si este mensaje no desaparece, la interfaz no pudo cargarse correctamente.</p>
        <p id="app-fallback-detail" style="font-size:.9rem;color:#78716c">Volvé a intentar en unos instantes. Si el problema continúa, informanos para poder revisarlo.</p>
      </main>
    </div>
    <script>
      (function () {
        var fallback = function (title, detail) {
          var message = document.getElementById('app-fallback-message');
          var extra = document.getElementById('app-fallback-detail');
          if (message) message.textContent = title;
          if (extra) {
            extra.textContent = detail;
            extra.style.whiteSpace = 'pre-wrap';
            extra.style.overflowWrap = 'anywhere';
          }
        };
        var logDiagnostic = function (name, details) {
          try { console.error('[SaborClick Diagnostics] ' + name, details); } catch (_) {}
        };
        console.info('[SaborClick Diagnostics] HTML de entrada ejecutado', {
          url: location.href, readyState: document.readyState, userAgent: navigator.userAgent
        });
        window.addEventListener('error', function (event) {
          var target = event.target;
          var resourceError = !!(target && target !== window);
          var details = {
            eventType: event.type,
            resourceError: resourceError,
            targetTag: target && target.tagName || null,
            targetSrc: target && target.src || null,
            targetHref: target && target.href || null,
            message: event.message || null,
            filename: event.filename || null,
            line: event.lineno || null,
            column: event.colno || null,
            stack: event.error && event.error.stack || null,
            time: new Date().toISOString()
          };
          logDiagnostic('window.error', details);
          if (resourceError) {
            var resource = details.targetSrc || details.targetHref || details.targetTag || 'recurso desconocido';
            fallback('No se pudo cargar un recurso de la aplicación.', 'Recurso: ' + resource);
            return;
          }
          var locationDetail = event.filename
            ? ' Archivo: ' + event.filename + (event.lineno ? ':' + event.lineno : '') + (event.colno ? ':' + event.colno : '')
            : '';
          fallback('Se produjo un error al iniciar la aplicación.', (event.message || 'Error JavaScript sin detalle') + locationDetail);
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var reason = event.reason;
          var detail = reason && reason.stack ? reason.stack :
            reason && reason.message ? reason.message : String(reason || 'Promesa rechazada sin detalle');
          logDiagnostic('unhandledrejection', { reason: detail, time: new Date().toISOString() });
          fallback('La aplicación falló durante su inicialización.', detail);
        });
        window.addEventListener('securitypolicyviolation', function (event) {
          logDiagnostic('securitypolicyviolation', {
            blockedURI: event.blockedURI, violatedDirective: event.violatedDirective,
            effectiveDirective: event.effectiveDirective, sourceFile: event.sourceFile,
            lineNumber: event.lineNumber, columnNumber: event.columnNumber,
            disposition: event.disposition, originalPolicy: event.originalPolicy,
            time: new Date().toISOString()
          });
        });
        window.addEventListener('load', function () {
          console.info('[SaborClick Diagnostics] window.load completado', new Date().toISOString());
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
